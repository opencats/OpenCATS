name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop, feature/** ]
    tags: ['v*'] # Triggers when you push a tag like v1.0.0
  pull_request:
    branches: [ master, develop ]

jobs:
  # JOB 1: Test, Lint, and Audit
  tests:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.2', '8.2']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      # --- NEW: Linting ---
      - name: PHP Syntax Check (Lint)
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      # --- NEW: Security Audit ---
      - name: Composer Security Audit
        run: composer audit

      - name: Create Reports Directory
        run: mkdir -p reports/behat-default reports/behat-security test/screenshots

      - name: Run PHPUnit (Unit Tests)
        run: ./vendor/bin/phpunit --log-junit reports/unit-report.xml src/OpenCATS/Tests/UnitTests

      - name: Run Integration Tests (Docker)
        run: |
          cd docker/
          docker compose -f docker-compose-test.yml up -d
          docker compose -f docker-compose-test.yml exec -T --workdir /var/www/public php php modules/tests/waitForDb.php
          docker compose -f docker-compose-test.yml exec -T --workdir /var/www/public php ./vendor/bin/phpunit --log-junit /var/www/public/reports/integration-report.xml src/OpenCATS/Tests/IntegrationTests
          docker compose -f docker-compose-test.yml exec -T --workdir /var/www/public php ./vendor/bin/behat -v -c ./test/behat.yml --suite="default" --format=pretty --out=std --format=junit --out=/var/www/public/reports/behat-default
          docker compose -f docker-compose-test.yml exec -T --workdir /var/www/public php ./vendor/bin/behat -v -c ./test/behat.yml --suite="security" --format=pretty --out=std --format=junit --out=/var/www/public/reports/behat-security
        continue-on-error: true

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'reports/**/*.xml'
          check_name: "Test Results - PHP ${{ matrix.php-version }}"

      - name: Upload Behat Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-php${{ matrix.php-version }}
          path: test/screenshots/
          retention-days: 5

      - name: Shutdown Docker
        if: always()
        run: cd docker && docker compose -f docker-compose-test.yml down

  # JOB 2: Automated Release (Only on Tags)
  release:
    needs: tests # Only run if tests pass
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Archive
        run: |
          # Create a zip of the source, excluding dev/test files
          zip -r opencats-${{ github.ref_name }}.zip . -x "*.git*" "docker/*" "test/*" "reports/*"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "OpenCATS ${{ github.ref_name }}" \
            --notes "Automated release from CI build" \
            opencats-${{ github.ref_name }}.zip
