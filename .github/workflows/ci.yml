name: CI Build

on:
  push:
    branches:
      - master
      - develop
      - Feature-php8.2_compat
      - feature/migrate-ci-to-github-actions
  pull_request:
    branches:
      - master
      - develop
      - feature/migrate-ci-to-github-actions
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.2', '8.2']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Create Reports Directory
        run: mkdir -p reports/behat-default reports/behat-security

      - name: Run PHPUnit (Unit Tests)
        run: ./vendor/bin/phpunit --log-junit reports/unit-report.xml src/OpenCATS/Tests/UnitTests

- name: Run Integration Tests (Docker)
        run: |
          cd docker/
          docker compose -f docker-compose-test.yml up -d

          # 1. Wait for DB
          docker compose -f docker-compose-test.yml exec -T php php modules/tests/waitForDb.php

          # 2. Run Integration PHPUnit
          docker compose -f docker-compose-test.yml exec -T php ./vendor/bin/phpunit --log-junit /var/www/public/reports/integration-report.xml src/OpenCATS/Tests/IntegrationTests

          # 3. Run Behat "Default" Suite with JUnit output
          # We use --format junit --out [directory]
          docker compose -f docker-compose-test.yml exec -T php ./vendor/bin/behat -v -c ./test/behat.yml --suite="default" --format=pretty --out=std --format=junit --out=/var/www/public/reports/behat-default

          # 4. Run Behat "Security" Suite with JUnit output
          docker compose -f docker-compose-test.yml exec -T php ./vendor/bin/behat -v -c ./test/behat.yml --suite="security" --format=pretty --out=std --format=junit --out=/var/www/public/reports/behat-security
        continue-on-error: true

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          # This glob pattern '**/*.xml' will now find:
          # - reports/unit-report.xml
          # - reports/integration-report.xml
          # - reports/behat-default/*.xml (multiple files)
          # - reports/behat-security/*.xml (multiple files)
          report_paths: 'reports/**/*.xml'
          detailed_summary: true
          include_passed: true
          check_name: "Test Results - PHP ${{ matrix.php-version }}"

      - name: Shutdown Docker
        if: always()
        run: |
          cd docker
          docker compose -f docker-compose-test.yml down
