# Preserve the bundled site's basic configuration.
resolver 127.0.0.11 valid=30s;
include conf.d/directive-only/x-ua-compatible.conf;
include conf.d/directive-only/extra-security.conf;
include conf.d/directive-only/ssl.conf;
include conf.d/directive-only/cross-domain-insecure.conf;
include conf.d/location/expires.conf;
include conf.d/location/cross-domain-fonts.conf;

# Serve archives only through the attachment controller. Backup progress polling
# still uses the existing progress.txt file.
location ~* /attachments/(.*/)?catsbackup\.(bak|sql(\.[0-9]+)?)$ {
    return 403;
}
